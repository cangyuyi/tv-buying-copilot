          text: "{{#sys.query#}}"
        variables: []
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        memory:
          query_prompt_template: "{{#sys.query#}}\n\n{{#sys.files#}}"
          window:
            enabled: true
            size: 5
