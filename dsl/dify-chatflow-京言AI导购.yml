version: "0.6.0"
kind: app
app:
  name: "京言·3C家电AI导购Agent"
  mode: advanced-chat
  icon: "\U0001F6D2"
  icon_background: "#E0F2FE"
  icon_type: emoji
  description: "京东3C家电AI导购Agent，多智能体协同：意图识别→商品检索→优惠计算→履约咨询→售后客服，含合规审核兜底"
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  environment_variables: []
  conversation_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_types:
      - image
      allowed_file_extensions:
      - .JPG
      - .PNG
      - .JPEG
      - .WEBP
      allowed_file_upload_methods:
      - local_file
      - remote_url
      number_limits: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: "您好！我是京言AI导购助手，专注3C家电选购。我可以帮您：\n1. 推荐/对比电视，翻译专业参数\n2. 查询优惠、计算到手价\n3. 解答安装、物流、以旧换新问题\n4. 售后政策咨询\n\n请问有什么可以帮您？"
    suggested_questions:
    - "推荐个75寸电视，预算6000，放客厅"
    - "Mini LED和OLED有什么区别？"
    - "TCL 75Q10G Pro和海信75E8K哪个好？"
    - "挂装电视多少钱？"
    suggested_questions_after_answer:
      enabled: true
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
  graph:
    edges:
    - id: "edge-start-classifier"
      source: "start_node"
      sourceHandle: "source"
      target: "classifier_node"
      targetHandle: "target"
      type: "custom"
      data:
        sourceType: "start"
        targetType: "question-classifier"
        isInIteration: false
        isInLoop: false
    - id: "edge-classifier-product"
      source: "classifier_node"
      sourceHandle: "product"
      target: "retrieval_product"
      targetHandle: "target"
      type: "custom"
      data:
        sourceType: "question-classifier"
        targetType: "knowledge-retrieval"
        isInIteration: false
        isInLoop: false
    - id: "edge-classifier-pricing"
      source: "classifier_node"
      sourceHandle: "pricing"
      target: "retrieval_pricing"
      targetHandle: "target"
      type: "custom"
      data:
        sourceType: "question-classifier"
        targetType: "knowledge-retrieval"
        isInIteration: false
        isInLoop: false
    - id: "edge-classifier-fulfillment"
      source: "classifier_node"
      sourceHandle: "fulfillment"
      target: "retrieval_fulfillment"
      targetHandle: "target"
      type: "custom"
      data:
        sourceType: "question-classifier"
        targetType: "knowledge-retrieval"
        isInIteration: false
        isInLoop: false
    - id: "edge-classifier-aftersales"
      source: "classifier_node"
      sourceHandle: "aftersales"
      target: "retrieval_aftersales"
      targetHandle: "target"
      type: "custom"
      data:
        sourceType: "question-classifier"
        targetType: "knowledge-retrieval"
        isInIteration: false
        isInLoop: false
    - id: "edge-classifier-unclear"
      source: "classifier_node"
      sourceHandle: "unclear"
      target: "llm_unclear"
      targetHandle: "target"
      type: "custom"
      data:
        sourceType: "question-classifier"
        targetType: "llm"
        isInIteration: false
        isInLoop: false
    - id: "edge-classifier-other"
      source: "classifier_node"
      sourceHandle: "other"
      target: "llm_other"
      targetHandle: "target"
      type: "custom"
      data:
